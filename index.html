<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Learning - Fixed Mobile</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jQuery-rwdImageMaps/1.6/jquery.rwdImageMaps.min.js"></script>
    <style>
        body { margin: 0; padding: 0; text-align: center; background-color: #ffffff; font-family: sans-serif; }
        .instruction { background: #333; color: white; padding: 10px; font-size: 14px; position: relative; z-index: 2000; }
        
        /* الحاوية يجب أن تكون مضبوطة بدقة */
        .image-container { 
            position: relative; 
            display: inline-block; 
            margin: 20px auto; 
            max-width: 100%;
        }

        img { 
            max-width: 100%; 
            height: auto; 
            display: block; 
            z-index: 1;
        }

        /* مربع التركيز المطور */
        #highlight-box {
            position: absolute;
            pointer-events: none;
            /* استخدام shadow ضخم لتغطية الشاشة */
            box-shadow: 0 0 0 5000px rgba(0, 0, 0, 0.7); 
            z-index: 1000;
            display: none;
            border: 2px solid #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* إخفاء أي زيادة خارج الحاوية لضمان عدم ظهور شريط تمرير */
        .outer-wrapper { overflow: hidden; position: relative; width: 100%; }

        area { cursor: pointer; outline: none; }
    </style>
</head>
<body>

    <div class="instruction">أنقر على مكبر الصوت او الكلمة لسماع النطق</div>

    <div class="outer-wrapper">
        <div class="image-container" id="container">
            <div id="highlight-box"></div>
            <img src="meansoftransport.png" usemap="#image-map" id="colorImage">
            <map name="image-map">
    <area onclick="speak('MEANS OF TRANSPORT', this)" coords="482,162,1096,310" shape="rect">
    <area onclick="speak('MOTORCYCLE', this)" coords="579,385,38,472" shape="rect">
    <area onclick="speak('CAR', this)" coords="1032,512,1327,601" shape="rect">
    <area onclick="speak('JET-SKI', this)" coords="484,653,167,723" shape="rect">
    <area onclick="speak('TRACTOR', this)" coords="494,633,846,790" shape="rect">
    <area onclick="speak('CANOE', this)" coords="864,677,1160,746" shape="rect">
    <area onclick="speak('PADDLE', this)" coords="922,755,1206,797" shape="rect">
    <area onclick="speak('SAIL', this)" coords="1112,804,919,859" shape="rect">
    <area onclick="speak('BUS', this)" coords="340,797,89,882" shape="rect">
    <area onclick="speak('SKATEBOARD', this)" coords="275,918,718,996" shape="rect">
    <area onclick="speak('BOAT', this)" coords="740,979,1011,1058" shape="rect">
    <area onclick="speak('KAYAK', this)" coords="1030,1044,1341,1117" shape="rect">
    <area onclick="speak('TAXI', this)" coords="529,1132,711,1259" shape="rect">
    <area onclick="speak('AIRPLANE', this)" coords="123,1179,467,1393" shape="rect">
    <area onclick="speak('SHIP', this)" coords="1001,1248,1321,1349" shape="rect">
    <area onclick="speak('MAIN ROTOR', this)" coords="1077,1362,1342,1459" shape="rect">
    <area onclick="speak('TAIL ROTOR', this)" coords="600,1635,770,1766" shape="rect">
    <area onclick="speak('LANDING SKIDS', this)" coords="774,1653,964,1723" shape="rect">
    <area onclick="speak('HELICOPTER', this)" coords="871,1726,1323,1790" shape="rect">
    <area onclick="speak('GARBAGE TRUCK', this)" coords="232,1648,549,1833" shape="rect">
</map>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#colorImage').rwdImageMaps();
            
            document.body.addEventListener('touchstart', function() {
                window.speechSynthesis.getVoices();
            }, {once: true});
        });

        function speak(word, element) {
            window.speechSynthesis.cancel();
            var msg = new SpeechSynthesisUtterance(word);
            msg.lang = 'en-US';
            msg.rate = 0.9;

            msg.onend = function() {
                document.getElementById('highlight-box').style.display = 'none';
            };
            
            window.speechSynthesis.speak(msg);

            // استدعاء وظيفة التظليل مع تأخير بسيط لضمان دقة الحسابات على الموبايل
            setTimeout(function() {
                showHighlight(element);
            }, 10);
        }

        function showHighlight(areaElement) {
            var img = document.getElementById('colorImage');
            var highlight = document.getElementById('highlight-box');
            
            // قراءة الإحداثيات الحالية (التي تم تعديلها بواسطة مكتبة rwdImageMaps)
            var currentCoords = areaElement.coords.split(',');
            var xCoords = [], yCoords = [];

            for (var i = 0; i < currentCoords.length; i += 2) {
                xCoords.push(parseFloat(currentCoords[i]));
                yCoords.push(parseFloat(currentCoords[i+1]));
            }

            var minX = Math.min(...xCoords);
            var maxX = Math.max(...xCoords);
            var minY = Math.min(...yCoords);
            var maxY = Math.max(...yCoords);

            // تحديد الموقع بدقة متناهية بالنسبة للحاوية
            highlight.style.left = minX + "px";
            highlight.style.top = minY + "px";
            highlight.style.width = (maxX - minX) + "px";
            highlight.style.height = (maxY - minY) + "px";
            
            highlight.style.display = "block";
        }
    </script>
</body>
</html>
